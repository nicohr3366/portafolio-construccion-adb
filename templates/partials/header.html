{% with current=request.resolver_match.url_name %}
<header class="site-header">
    <div class="container site-header__inner">
        <a class="brand" href="{% url 'sitio:inicio' %}">
            <span class="brand__seal">ADB</span>
            <span class="brand__text">
                <span class="brand__name">Alexander Drada</span>
                <span class="brand__tagline">Construcciones y Remodelaciones</span>
            </span>
        </a>
        <nav class="nav" aria-label="Principal">
            <ul class="nav__list">
                <li><a class="nav__link" href="{% url 'sitio:inicio' %}"{% if current == 'inicio' %} aria-current="page"{% endif %}>Inicio</a></li>
                <li><a class="nav__link" href="{% url 'sitio:servicios' %}"{% if current == 'servicios' %} aria-current="page"{% endif %}>Servicios</a></li>
                <li><a class="nav__link" href="{% url 'sitio:galeria' %}"{% if current == 'galeria' %} aria-current="page"{% endif %}>Galería</a></li>
                <li><a class="nav__link" href="{% url 'sitio:quienes_somos' %}"{% if current == 'quienes_somos' %} aria-current="page"{% endif %}>Quiénes Somos</a></li>
                <li><a class="nav__link" href="{% url 'sitio:contacto' %}"{% if current == 'contacto' %} aria-current="page"{% endif %}>Contacto</a></li>
            </ul>
        </nav>
    </div>
</header>
{% endwith %}
